<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/footer.css" />

    <title>Slideshow</title>
  </head>
  <body>
    <!-- header -------------------------------------------------------------- -->
    <header><h1 class="header-title">Slideshow</h1></header>
    <!-- main ----------------------------------------------------------------- -->
    <main class="main-content">
      <div class="main-content__left">
        <img
          class="main-content__arrow arrow-left"
          src="./assets/icons/arrow_back.svg"
          alt="back arrow"
        />
      </div>
      <div class="main-content__center">
        <!-- TODO Replace image with actual image and write better alt text.  -->
        <img
          class="main-content__image"
          src="./assets/images/ClaudeShrideLily.jpeg"
          alt="Really cool image"
        />
        <div class="main-content__caption">
          <h3 class="caption-title">TITLE</h3>
          <p class="caption-description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt
            nesciunt minus beatae possimus laboriosam vero reiciendis animi
            facere nihil et!
          </p>
        </div>
      </div>
      <div class="main-content__right">
        <img
          class="main-content__arrow arrow-right"
          src="./assets/icons/arrow_forward.svg"
          alt="forwards arrow"
        />
      </div>
    </main>
    <!-- footer ---------------------------------------------------------------- -->
    <footer class="footer">
      <p class="footer__image-count">1/10</p>
    </footer>
    <script src="./js/app.js"></script>
  </body>
</html>
